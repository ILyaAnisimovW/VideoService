spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parking}
    username: ${SPRING_DATASOURCE_USERNAME:parking}
    password: ${SPRING_DATASOURCE_PASSWORD:parking}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    # validate — Hibernate только сверяет entity со схемой, Flyway управляет схемой
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # true только если накатываешь на уже существующую БД
    validate-on-migrate: true    # падает при старте если checksum миграции изменился

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redispass}

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.prod: DEBUG                        # твои классы — видишь всё
    org.springframework.security: DEBUG    # покажет где именно 403
    org.springframework.web: DEBUG         # покажет маппинг запросов
    org.hibernate.SQL: DEBUG              # SQL запросы
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:parking-photos}
  region: ${S3_REGION:us-east-1}
  presigned-ttl-minutes: ${S3_PRESIGNED_TTL_MINUTES:60}